name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.x"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test
        run: go test ./...
      # spec-p4-b1 3.8: B4 and B9 must really run on Windows. A SKIP, or a test
      # that is not there at all, still leaves `go test` green, so each one has
      # to show up as a PASS.
      - name: B4 and B9 pass on windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          go test ./test/e2e/ ./internal/handoff/ -count=1 -v \
            -run 'TestBusyRefused|TestPTYRun|TestBusyProcessInCwd|TestBusyIgnoresOwnDescendants' | tee win-b4-b9.txt
          for t in TestBusyRefused TestPTYRun TestBusyProcessInCwd TestBusyIgnoresOwnDescendants; do
            grep -q -- "--- PASS: $t " win-b4-b9.txt || { echo "$t did not PASS on windows"; exit 1; }
          done
      # spec-p4-b1 3.8 leaves bracketed paste under ConPTY to measurement: the
      # child in TestRunConPTYEcho prints raw=<the bytes ConPTY handed it>, and
      # this step exists so that line lands in the log even when the test passes.
      - name: conpty bracketed paste evidence
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go test ./internal/driver/pty/ -count=1 -v -run 'TestRunConPTYEcho|TestBracketedPaste'

  race:
    name: race
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test -race
        run: go test -race ./...

  i18n:
    name: i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: check locales
        run: make i18n

  cross:
    name: cross
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: cross compile
        run: make cross
      - name: six artifacts expected
        shell: bash
        run: |
          ls -l dist
          test "$(ls dist | wc -l)" -ge 6
      - uses: actions/upload-artifact@v4
        with:
          name: ferry-dev-binaries
          path: dist/
          retention-days: 7
